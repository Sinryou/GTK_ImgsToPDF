name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache GTK3 Runtime
        id: cache-gtk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gtk3-runtime
          key: gtk3-runtime-3.24.24-v2

      - name: Download and Setup GTK3 Runtime
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\gtk3-installer.exe"
          $installDir = "${{ runner.temp }}\gtk3-runtime"
          $url = "https://github.com/tschoonj/GTK-for-Windows-Runtime-Environment-Installer/releases/download/2021-01-30/gtk3-runtime-3.24.24-2021-01-30-ts-win64.exe"
          
          Write-Host "Downloading GTK3 runtime installer..."
          Invoke-WebRequest -Uri $url -OutFile $installer
          
          Write-Host "Extracting GTK3 runtime via 7z..."
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          & 7z x $installer -o"$installDir" -y | Out-Null
          
          # 7z 解包 NSIS 安装包时，根目录的 DLL/EXE 会位于 $_63_ 目录下。
          # 将其移动到根目录下，以符合 GTK_ImgsToPDF.csproj 对 GtkRuntimeSource 根目录 *.dll 的结构期望。
          if (Test-Path "$installDir\`$_63_") {
              Get-ChildItem -LiteralPath "$installDir\`$_63_" | Move-Item -Destination "$installDir\" -Force
              Remove-Item -LiteralPath "$installDir\`$_63_" -Force
          }
          Remove-Item -LiteralPath "$installDir\`$PLUGINSDIR" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path $installer -Force -ErrorAction SilentlyContinue

          # 校验解包有效性
          if (!(Test-Path "$installDir\libgtk-3-0.dll")) {
              throw "GTK3 解包失败：未找到 $installDir\libgtk-3-0.dll"
          }
          Write-Host "GTK3 运行时准备就绪。"

      - name: Publish Windows App
        shell: pwsh
        run: |
          dotnet publish GTK_ImgsToPDF/GTK_ImgsToPDF.csproj -c Release -r win-x64 -p:GtkRuntimeSource="${{ runner.temp }}\gtk3-runtime"
          
          # 校验发布产物中是否成功打包 runtime\
          if (!(Test-Path "GTK_ImgsToPDF\bin\Release\net10.0\win-x64\publish\runtime\bin\libgtk-3-0.dll")) {
              throw "发布产物验证失败：缺少 runtime\ 运行时目录！"
          }
          Write-Host "Windows 应用及 GTK3 运行时已成功发布。"

      - name: Package Windows Zip
        shell: pwsh
        run: |
          7z a -tzip GTK_ImgsToPDF-windows-x64.zip .\GTK_ImgsToPDF\bin\Release\net10.0\win-x64\publish\*

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTK_ImgsToPDF-windows-x64
          path: GTK_ImgsToPDF-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Publish Linux App
        run: |
          dotnet publish GTK_ImgsToPDF/GTK_ImgsToPDF.csproj -c Release -r linux-x64
          
          # 校验发布产物
          if [ ! -f "GTK_ImgsToPDF/bin/Release/net10.0/linux-x64/publish/GTK_ImgsToPDF" ]; then
              echo "发布产物验证失败：缺少可执行文件！"
              exit 1
          fi

      - name: Package Linux tar.gz
        run: |
          tar -czvf GTK_ImgsToPDF-linux-x64.tar.gz -C GTK_ImgsToPDF/bin/Release/net10.0/linux-x64/publish .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTK_ImgsToPDF-linux-x64
          path: GTK_ImgsToPDF-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: GTK_ImgsToPDF-windows-x64
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: GTK_ImgsToPDF-linux-x64
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/GTK_ImgsToPDF-windows-x64.zip
            release-assets/GTK_ImgsToPDF-linux-x64.tar.gz
          generate_release_notes: true
