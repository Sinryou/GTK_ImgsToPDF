name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache GTK3 Runtime
        id: cache-gtk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gtk3-runtime
          key: gtk3-runtime-3.24.24-v2

      - name: Download and Setup GTK3 Runtime
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\gtk3-installer.exe"
          $installDir = "${{ runner.temp }}\gtk3-runtime"
          $url = "https://github.com/tschoonj/GTK-for-Windows-Runtime-Environment-Installer/releases/download/2021-01-30/gtk3-runtime-3.24.24-2021-01-30-ts-win64.exe"
          
          Write-Host "Downloading GTK3 runtime installer..."
          Invoke-WebRequest -Uri $url -OutFile $installer
          
          Write-Host "Extracting GTK3 runtime via 7z..."
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          & 7z x $installer -o"$installDir" -y | Out-Null
          
          # 7z 解包 NSIS 安装包时，根目录的 DLL/EXE 会位于 $_63_ 目录下。
          # 将其移动到根目录下，以符合 GTK_ImgsToPDF.csproj 对 GtkRuntimeSource 根目录 *.dll 的结构期望。
          if (Test-Path "$installDir\`$_63_") {
              Get-ChildItem -LiteralPath "$installDir\`$_63_" | Move-Item -Destination "$installDir\" -Force
              Remove-Item -LiteralPath "$installDir\`$_63_" -Force
          }
          Remove-Item -LiteralPath "$installDir\`$PLUGINSDIR" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path $installer -Force -ErrorAction SilentlyContinue

          # 校验解包有效性
          if (!(Test-Path "$installDir\libgtk-3-0.dll")) {
              throw "GTK3 解包失败：未找到 $installDir\libgtk-3-0.dll"
          }
          Write-Host "GTK3 运行时准备就绪。"

      - name: Publish Windows App
        shell: pwsh
        run: |
          dotnet publish GTK_ImgsToPDF/GTK_ImgsToPDF.csproj -c Release -r win-x64 -p:GtkRuntimeSource="${{ runner.temp }}\gtk3-runtime"
          
          # 校验发布产物中是否成功打包 runtime\
          if (!(Test-Path "GTK_ImgsToPDF\bin\Release\net10.0\win-x64\publish\runtime\bin\libgtk-3-0.dll")) {
              throw "发布产物验证失败：缺少 runtime\ 运行时目录！"
          }
          Write-Host "Windows 应用及 GTK3 运行时已成功发布。"

      - name: Package Windows 7z
        shell: pwsh
        run: |
          $publishDir = "GTK_ImgsToPDF\bin\Release\net10.0\win-x64\publish"
          $archive = "GTK_ImgsToPDF-windows-x64.7z"

          # LZMA2 固实压缩：相比 zip(deflate) 能显著减小 .NET 单文件与 GTK3 运行时的体积。
          # 归档内的路径结构与原先的 zip 保持一致（文件位于归档根目录）。
          7z a -t7z -m0=lzma2 -mx=9 -md=256m -mfb=273 -ms=on -mmt=on $archive "$publishDir\*"
          if ($LASTEXITCODE -ne 0) { throw "7z 打包失败，退出码 $LASTEXITCODE" }

          if (!(Test-Path $archive)) { throw "打包验证失败：未生成 $archive" }
          7z t $archive | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "打包验证失败：$archive 完整性校验未通过" }

          Write-Host ("压缩包体积: {0:N1} MB" -f ((Get-Item $archive).Length / 1MB))

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTK_ImgsToPDF-windows-x64
          path: GTK_ImgsToPDF-windows-x64.7z
          if-no-files-found: error

  build-linux:
    name: Build Linux (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Publish Linux App
        run: |
          dotnet publish GTK_ImgsToPDF/GTK_ImgsToPDF.csproj -c Release -r linux-x64
          
          # 校验发布产物
          if [ ! -f "GTK_ImgsToPDF/bin/Release/net10.0/linux-x64/publish/GTK_ImgsToPDF" ]; then
              echo "发布产物验证失败：缺少可执行文件！"
              exit 1
          fi

      - name: Package Linux tar.xz
        run: |
          set -o pipefail
          publish_dir="GTK_ImgsToPDF/bin/Release/net10.0/linux-x64/publish"
          archive="GTK_ImgsToPDF-linux-x64.tar.xz"

          # 保留 tar 容器（权限位、符号链接完整），压缩端换成 xz -9e 以提高压缩比。
          # 不使用 .7z：p7zip 不保存 Unix 权限位，解压后可执行文件会丢失 +x。
          tar -cf - -C "$publish_dir" . | xz -9e -T0 -c > "$archive"

          # 校验：非空 + 归档可读
          test -s "$archive"
          tar -tJf "$archive" > /dev/null
          ls -lh "$archive"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTK_ImgsToPDF-linux-x64
          path: GTK_ImgsToPDF-linux-x64.tar.xz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: GTK_ImgsToPDF-windows-x64
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: GTK_ImgsToPDF-linux-x64
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/GTK_ImgsToPDF-windows-x64.7z
            release-assets/GTK_ImgsToPDF-linux-x64.tar.xz
          generate_release_notes: true
