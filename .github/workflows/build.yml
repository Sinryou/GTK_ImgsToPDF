name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache GTK3 Runtime
        id: cache-gtk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gtk3-runtime
          key: gtk3-runtime-3.24.24

      - name: Download and Setup GTK3 Runtime
        if: steps.cache-gtk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\gtk3-installer.exe"
          $installDir = "${{ runner.temp }}/gtk3-runtime"
          $url = "https://github.com/tschoonj/GTK-for-Windows-Runtime-Environment-Installer/releases/download/2021-01-30/gtk3-runtime-3.24.24-2021-01-30-ts-win64.exe"
          
          Write-Host "Downloading GTK3 runtime installer..."
          Invoke-WebRequest -Uri $url -OutFile $installer
          
          Write-Host "Installing GTK3 runtime silently..."
          Start-Process -FilePath $installer -ArgumentList "/S", "/D=$installDir" -Wait
          Start-Sleep -Seconds 3
          
          # GTK_ImgsToPDF.csproj 期望根目录下有 *.dll
          if (Test-Path "$installDir\bin") {
              Get-ChildItem -Path "$installDir\bin\*.dll" | Move-Item -Destination "$installDir\" -Force
              Remove-Item -Path "$installDir\bin" -Recurse -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -Path $installer -Force -ErrorAction SilentlyContinue

      - name: Publish Windows App
        shell: pwsh
        run: |
          dotnet publish GTK_ImgsToPDF/GTK_ImgsToPDF.csproj -c Release -r win-x64 -p:GtkRuntimeSource="${{ runner.temp }}/gtk3-runtime"

      - name: Package Windows Zip
        shell: pwsh
        run: |
          7z a -tzip GTK_ImgsToPDF-windows-x64.zip .\GTK_ImgsToPDF\bin\Release\net10.0\win-x64\publish\*

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTK_ImgsToPDF-windows-x64
          path: GTK_ImgsToPDF-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Publish Linux App
        run: |
          dotnet publish GTK_ImgsToPDF/GTK_ImgsToPDF.csproj -c Release -r linux-x64

      - name: Package Linux tar.gz
        run: |
          tar -czvf GTK_ImgsToPDF-linux-x64.tar.gz -C GTK_ImgsToPDF/bin/Release/net10.0/linux-x64/publish .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTK_ImgsToPDF-linux-x64
          path: GTK_ImgsToPDF-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: GTK_ImgsToPDF-windows-x64
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: GTK_ImgsToPDF-linux-x64
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/GTK_ImgsToPDF-windows-x64.zip
            release-assets/GTK_ImgsToPDF-linux-x64.tar.gz
          generate_release_notes: true
